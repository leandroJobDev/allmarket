<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      <!-- QR realmente aproximado das bordas -->
    <g fill="#1f4fbf">
        <!-- Cantos ajustados -->
        <path d="M40 40 h90 v22 h-68 v68 h-22z"/>
        <path d="M472 40 h-90 v22 h68 v68 h22z"/>
        <path d="M40 472 h90 v-22 h-68 v-68 h-22z"/>
        <path d="M472 472 h-90 v-22 h68 v-68 h22z"/>

        <!-- 3 Quadrados centrais maiores -->
        <rect x="85" y="85" width="170" height="170"/>
        <rect x="135" y="135" width="70" height="70" fill="#e6f0ff"/>

        <rect x="265" y="85" width="170" height="170"/>
        <rect x="315" y="135" width="70" height="70" fill="#e6f0ff"/>

        <rect x="85" y="262" width="170" height="170"/>
        <rect x="135" y="312" width="70" height="70" fill="#e6f0ff"/>

        <!-- ALL em quadradinhos MENOR na parte inferior direita -->
        <g fill="#1f4fbf">
            <!-- Letra A menor -->
            <rect x="300" y="370" width="12" height="48"/>
            <rect x="310" y="370" width="36" height="12"/>
            <rect x="310" y="400" width="36" height="12"/>
            <rect x="340" y="370" width="12" height="48"/>


            <!-- Letra L menor -->
            <rect x="355" y="370" width="12" height="48"/>
            <rect x="355" y="406" width="40" height="12"/>

            <!-- Letra L menor (segunda) -->
            <rect x="400" y="370" width="12" height="48"/>
            <rect x="400" y="406" width="40" height="12"/>
        </g>
    </g>

    <!-- Círculo -->
    <circle cx="256" cy="256" r="120" fill="#1f4fbf"/>

    <!-- Conteúdo interno ampliado ($ com arco) -->
    <g transform="translate(256 256) scale(1.15) translate(-256 -256)">
        <rect x="200" y="220" width="115" height="90" fill="#ffffff"/>
        <path d="M200 220 Q257.5 160 315 220"
              fill="none"
              stroke="#ffffff"
              stroke-width="5"
              stroke-linecap="round"/>
        <text x="256"
              y="270"
              text-anchor="middle"
              dominant-baseline="middle"
              font-size="100"
              font-weight="900"
              fill="#1f4fbf"
              font-family="Arial Black, Helvetica, sans-serif">
            $
        </text>
    </g>
</svg>
