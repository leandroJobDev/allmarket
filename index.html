<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>📝 AllM@rket - Comprou. Escaneou. Organizou.</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800">

    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen w-full bg-gray-50 px-4">

        <div
            class="bg-white border border-gray-100 rounded-[2.5rem] p-8 sm:p-10 shadow-2xl w-full max-w-[380px] text-center transition-all">

            <div class="mb-6">
                <div class="w-20 h-20 flex items-center justify-center mx-auto mb-6">
                    <img src="assets/favicon.svg" class="w-full h-full object-contain" alt="AllMarket">
                </div>

                <h3 class="text-2xl font-black text-gray-900 leading-tight mb-8 uppercase tracking-tighter">
                    Comprou. Escaneou. <br>
                    <span class="text-blue-600">Organizou.</span>
                </h3>

                <div id="google-btn-container" class="flex justify-center min-h-[50px] mb-8"></div>

                <p class="text-gray-500 font-medium px-2 text-sm leading-relaxed max-w-[280px] mx-auto">
                    ✨ Conecte sua conta Google e <br>
                    <span class="text-gray-800 font-bold">transforme suas notas</span> em economia de verdade.
                </p>
            </div>
        </div>

        <div class="mt-8 text-[10px] text-gray-400 font-black tracking-[0.2em]">
            &copy; 2026 AllM@rket
        </div>
    </div>

    <nav id="main-nav" class="bg-white border-b border-gray-200 p-4 mb-6 shadow-sm hidden">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div id="nav-auth" class="flex items-center gap-2 font-bold text-sm"></div>

            <div class="flex items-center gap-2">
                <div class="font-black text-gray-900 text-xl tracking-tighter uppercase">
                    All<span class="text-blue-600">M@rket</span>
                </div>
                <img src="assets/favicon.svg" class="h-8 w-8">
            </div>
        </div>
    </nav>

    <div id="app-content" class="max-w-4xl mx-auto px-6 pb-20 hidden">

        <header class="flex flex-col items-center pt-3 md:pt-10 px-4 mb-3 md:mb-12">
            <h1 class="text-3xl md:text-6xl font-black text-gray-900 tracking-tighter -mb-1 md:mb-2 transition-all">
                All<span class="text-blue-600">M@rket</span>
            </h1>

            <p class="text-[8px] md:text-sm uppercase font-bold text-gray-400 tracking-[0.2em] md:tracking-[0.4em]">
                Extrair. Escanear. <span class="text-blue-600">Economizar.</span>
            </p>
        </header>

        <div class="w-full max-w-lg mx-auto mb-6 px-4">

            <div
                class="flex items-center bg-white p-1 md:p-1.5 rounded-full border border-gray-200 shadow-lg focus-within:border-blue-400 transition-all">

                <input type="text" id="url-nota" placeholder="Cole o link da nota..."
                    class="flex-1 bg-transparent border-none outline-none px-4 py-2 text-sm md:text-base text-gray-700 placeholder:text-gray-400 min-w-0">

                <button onclick="processarNota()"
                    class="bg-blue-600 hover:bg-blue-700 text-white p-2 md:p-3 rounded-full transition-all active:scale-90 flex-shrink-0 shadow-md">

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 9h.01M15 9h.01M9 15h.01M15 15h.01" />
                    </svg>
                </button>

            </div>
        </div>

        <div id="historicoSec" class="hidden mb-12 animate-in fade-in duration-500">
            <div class="bg-white rounded-2xl shadow-xl p-6 border border-gray-100">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h3 class="text-xl font-black text-gray-900 tracking-tighter uppercase leading-none">
                            Minhas <span class="text-blue-600">Notas</span>
                        </h3>
                        <p id="contador-notas"
                            class="text-[9px] text-blue-500 font-bold uppercase tracking-widest mt-2 italic flex items-center gap-1">
                            <span class="animate-pulse">●</span> Sincronizado
                        </p>
                    </div>
                    <button onclick="fecharHistorico()"
                        class="text-gray-400 hover:text-white hover:bg-red-500 font-black text-[9px] bg-gray-50 px-4 py-2 rounded-full transition-all uppercase tracking-widest border border-gray-100">
                        Fechar ×
                    </button>
                </div>

                <input type="text" id="buscaNota" onkeyup="filtrarHistorico()"
                    placeholder="🔍 Buscar estabelecimento no histórico..."
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl text-sm outline-none focus:border-blue-500 transition-all mb-4">

                <div id="lista-hist" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>

                <div id="container-ver-mais" class="mt-6 text-center hidden">
                    <button onclick="mostrarMaisNotas()"
                        class="text-blue-600 font-black text-[10px] uppercase tracking-widest hover:underline">
                        + Carregar notas anteriores
                    </button>
                </div>
            </div>
        </div>

        <div id="res" class="hidden space-y-4">
            <div class="bg-white p-8 rounded-2xl shadow-lg border-t-8 border-blue-600 relative">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h2 id="loja" class="text-3xl font-black text-gray-900 tracking-tighter leading-tight"></h2>
                        <p id="estEndereco" class="text-[10px] text-gray-500 font-medium"></p>
                    </div>
                    <button onclick="document.getElementById('res').classList.add('hidden')"
                        class="bg-red-50 text-red-500 hover:bg-red-500 hover:text-white text-[9px] font-black px-3 py-1 rounded-full uppercase tracking-tighter transition-all">
                        Fechar Detalhes ×
                    </button>
                </div>

                <div class="mt-4 mb-6 pt-3 border-t border-dashed border-gray-100">
                    <p id="info-nota" class="text-blue-500 font-mono text-[10px] font-bold uppercase tracking-tight">
                    </p>
                    <span class="block text-[8px] text-gray-400 font-black uppercase tracking-widest mb-1">Chave de
                        Acesso</span>
                    <p id="chave-acesso" class="text-[10px] text-gray-600 font-mono break-all leading-tight mb-2"></p>
                </div>

                <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-gray-50 text-gray-400">
                            <tr>
                                <th class="p-4 font-black uppercase text-[10px] tracking-widest">Itens</th>
                                <th class="p-4 text-right font-black uppercase text-[10px] tracking-widest">Valor</th>
                            </tr>
                        </thead>
                        <tbody id="itens" class="divide-y divide-gray-50"></tbody>
                    </table>
                </div>
                <div class="mt-8 pt-6 border-t border-gray-100 flex justify-center">
                    <button id="btnRemoverNota"
                        class="flex items-center gap-2 text-red-400 hover:text-red-600 font-black text-[10px] uppercase tracking-widest transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="w-4 h-4">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-2.25a2.25 2.25 0 0 0-2.25-2.25h-4.5a2.25 2.25 0 0 0-2.25 2.25v2.25" />
                        </svg>
                        Remover nota
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
